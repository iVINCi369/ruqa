[package]
name = "iroh-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# Уже в дереве зависимостей iroh; объявляем явно ради вывода ключа хоста.
blake3 = "1"
futures-lite = "2.6.1"
iroh = "1.1.0"
iroh-mdns-address-lookup = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
